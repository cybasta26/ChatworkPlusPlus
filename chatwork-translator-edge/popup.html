<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="i18n.js"></script><script src="auto-settings.js"></script><title data-i18n="ui_100">Chatwork · Edge local translation</title><link rel="stylesheet" href="popup.css"></head>
<body><h1><span data-i18n="ui_101">Chatwork Translator</span></h1><p><span data-i18n="ui_102">Edge local edition · Translation below the original</span></p>
<label class="switch-row" for="enabled"><span data-i18n="ui_103">Enable auto-translation</span><span class="switch"><input id="enabled" type="checkbox" role="switch" disabled=""><span class="switch-track"></span></span></label>
<div id="auto-direction" hidden><select id="auto-source" data-i18n-aria-label="ui_108" aria-label="Source language" disabled></select><span aria-hidden="true">→</span><select id="auto-target" data-i18n-aria-label="ui_114" aria-label="Target language" disabled></select></div>
<div class="toolbar"><p id="status" role="status"><span data-i18n="ui_104">Reading settings…</span></p><button id="setup" hidden><span data-i18n="ui_105">Model / Language</span></button></div>
<section class="navigation-area"><label class="switch-row" for="mention-enabled"><span><span data-i18n="ui_036">Member navigation</span><small class="inline-note">TO / RE / SEND</small></span><span class="switch"><input id="mention-enabled" type="checkbox" role="switch" disabled=""><span class="switch-track"></span></span></label><span id="mention-setting-status" class="note" role="status"></span></section>
<section class="manual-area">
<label class="switch-row" for="manual-enabled"><span><span data-i18n="ui_106">Manual translation</span><small><span data-i18n="ui_107">Enter text to translate into another language</span></small></span><span class="switch"><input id="manual-enabled" type="checkbox" role="switch" aria-controls="manual-panel" disabled=""><span class="switch-track"></span></span></label>
<div id="manual-panel" hidden="">
<div class="translation-card"><label class="sr-only" for="manual-source"><span data-i18n="ui_108">Source language</span></label><select id="manual-source"><option value="zh" data-i18n="ui_109">Chinese (Simplified)</option><option value="ja" data-i18n="ui_110">Japanese</option><option value="en" data-i18n="ui_111">English</option><option value="ko" data-i18n="ui_112">Korean</option></select><label class="sr-only" for="manual-input"><span data-i18n="ui_113">Enter text</span></label><textarea id="manual-input" placeholder="Enter text" maxlength="10000" data-i18n-placeholder="ui_113"></textarea></div>
<div class="manual-actions"><span id="manual-count">0 / 10000</span><button id="manual-translate" type="button" disabled=""><span data-i18n="ui_015">Translate</span></button></div>
<div class="translation-card output-card"><label class="sr-only" for="manual-target"><span data-i18n="ui_114">Target language</span></label><select id="manual-target"><option value="ja" data-i18n="ui_110">Japanese</option><option value="zh" data-i18n="ui_109">Chinese (Simplified)</option><option value="en" data-i18n="ui_111">English</option><option value="ko" data-i18n="ui_112">Korean</option></select><label class="sr-only" for="manual-output"><span data-i18n="ui_115">Translation</span></label><textarea id="manual-output" placeholder="Translation" readonly="" data-i18n-placeholder="ui_115"></textarea><button id="manual-copy" type="button" disabled=""><span data-i18n="ui_116">Copy translation</span></button></div>
<p id="manual-status" class="note" role="status"><span data-i18n="ui_117">Enter text, then click Translate or press Ctrl+Enter.</span></p>
</div></section>
<script src="i18n-page.js"></script><script src="popup.js"></script><script src="protected-text.js"></script><script src="manual.js"></script>
</body></html>
