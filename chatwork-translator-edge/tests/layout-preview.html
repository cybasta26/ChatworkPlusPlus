<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Chatwork Edge 本地翻译</title><link rel="stylesheet" href="../popup.css"></head>
<body><h1>Chatwork 中文翻译</h1><p>Edge 本地版 · 译文显示在原文下方</p>
<label><input id="enabled" type="checkbox"> 开启自动翻译</label>
<div class="toolbar"><p id="status" role="status">读取设置中…</p><button id="setup">模型 / 语言设置</button></div>
<section class="manual-area">
<label class="switch-row" for="manual-enabled"><span>手动翻译<small>输入文字，翻译成另一种语言</small></span><span class="switch"><input id="manual-enabled" type="checkbox" role="switch" aria-controls="manual-panel"><span class="switch-track"></span></span></label>
<div id="manual-panel">
<div class="translation-card"><label class="sr-only" for="manual-source">原文语言</label><select id="manual-source"><option value="zh">中文（简体）</option><option value="ja">日语</option><option value="en">英语</option><option value="ko">韩语</option></select><label class="sr-only" for="manual-input">输入文本</label><textarea id="manual-input" placeholder="输入文本" maxlength="10000"></textarea></div>
<div class="manual-actions"><span id="manual-count">0 / 10000</span><button id="manual-translate" type="button">翻译</button></div>
<div class="translation-card output-card"><label class="sr-only" for="manual-target">译文语言</label><select id="manual-target"><option value="ja">日语</option><option value="zh">中文（简体）</option><option value="en">英语</option><option value="ko">韩语</option></select><label class="sr-only" for="manual-output">译文</label><textarea id="manual-output" placeholder="译文" readonly></textarea><button id="manual-copy" type="button">复制译文</button></div>
<p id="manual-status" class="note" role="status">输入文字后点击翻译，或按 Ctrl+Enter。</p>
</div></section>
</body></html>
